<div class="contenedor" *ngIf="tarea; else noEncontrado">
  <a routerLink="/tareas" class="volver">← Volver a tareas</a>

  <div class="tarjeta-detalle">
    <div class="cabecera-detalle">
      <span class="icono-tarea">📝</span>
      <div>
        <h1>{{ tarea.titulo }}</h1>
        <p class="fecha">Fecha límite: {{ tarea.fechaLimite }}</p>
      </div>
    </div>

    <p class="descripcion">{{ tarea.descripcion }}</p>

    <dl class="datos">
      <dt>Prioridad</dt>
      <dd><span class="badge" [ngClass]="'prioridad-' + tarea.prioridad.toLowerCase()">{{ tarea.prioridad }}</span></dd>
      <dt>Estado</dt>
      <dd><span class="badge" [ngClass]="'estado-' + tarea.estado.toLowerCase().replace(' ', '-')">{{ tarea.estado }}</span></dd>
    </dl>

    <div class="acciones-detalle">
      <a [routerLink]="['/tareas/editar', tarea.id]" class="btn btn-editar">✏️ Editar</a>
      <button class="btn btn-eliminar" (click)="eliminar()">🗑️ Eliminar</button>
    </div>
  </div>
</div>

<ng-template #noEncontrado>
  <div class="contenedor">
    <p class="vacio-msg">Tarea no encontrada.</p>
    <a routerLink="/tareas" class="volver">← Volver a tareas</a>
  </div>
</ng-template>
